# Docker Compose para QA local
# Nginx actúa como entrypoint y envía todo al backend unificado por FastCGI

services:
  # PostgreSQL 17 - NO expone puerto públicamente
  db:
    container_name: uned-postgres-qa
    image: supabase/postgres:17.6.1.079
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-uned_activities}
      POSTGRES_USER: postgres
    volumes:
      - postgres_data_qa:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - uned_qa_network

  # Redis 7 - NO expone puerto públicamente
  redis:
    image: redis:7-alpine
    container_name: uned-redis-qa
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data_qa:/data
    networks:
      - uned_qa_network

  # Backend PHP API - interno, NO expone puerto
  backend:
    container_name: uned-activities-qa
    image: uned-activities:qa-local
    build:
      context: ..
      dockerfile: containers/Containerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    restart: unless-stopped
    env_file:
      - ./env/local.env
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=uned_activities
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT=100
      - RATE_WINDOW=60
    expose:
      - "9000"
    networks:
      - uned_qa_network

  # Harvest scheduler - refresh activities periodically
  harvester:
    container_name: uned-activities-harvester-qa
    image: uned-activities:qa-local
    restart: unless-stopped
    env_file:
      - ./env/local.env
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=uned_activities
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT=100
      - RATE_WINDOW=60
    command: ["/bin/sh", "/app/infra/scripts/harvest-loop.sh"]
    depends_on:
      - db
      - redis
    networks:
      - uned_qa_network

  # Nginx entrypoint local (único puerto expuesto)
  nginx:
    image: nginx:1.25-alpine
    container_name: uned-nginx-qa
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.qa.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - uned_qa_network

volumes:
  postgres_data_qa:
  redis_data_qa:

networks:
  uned_qa_network:
    driver: bridge
