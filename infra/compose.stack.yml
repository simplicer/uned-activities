# Docker Compose Stack para producción con Traefik (Dokploy / Swarm)
#
# Nota Dokploy:
# - Dokploy ejecuta `docker stack deploy ... --with-registry-auth`, así que Swarm podrá hacer pull del registry
#   usando las credenciales configuradas en Dokploy.
# - Este stack NO usa bind-mounts del repo (evita el error de "bind source path does not exist" en Dokploy).
#
# Nota Swarm:
# - Para fijar donde corre el stack sin acoplarse al hostname, usa labels de nodo:
#   `docker node update --label-add uned.activities=true atenea`
#   y en el stack `node.labels.uned.activities == true`.

services:
  db:
    # Use a vanilla Postgres with pgvector installed (portable extensions + no vendor hooks).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: uned_activities
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.uned.activities == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ["sh", "-lc", "redis-server --requirepass \"$${REDIS_PASSWORD:-changeme}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.uned.activities == true
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    image: registry.storage.simplicer.com/lexemas/uned-activities:1.1.12
    # Auto-migrate on container start so "paste stack and deploy" works in Dokploy without SSH.
    command:
      - sh
      - -lc
      - |
        php infra/scripts/migrate.php up
        exec php -S 0.0.0.0:8080 -t apps/HttpApi/public apps/HttpApi/public/index.php
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_VERSION: "1.1.12"

      # Swarm DNS (estable; no depende del nombre del stack)
      DB_HOST: tasks.db
      DB_PORT: "5432"
      DB_NAME: uned_activities
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: tasks.redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}

      RATE_LIMIT: "100"
      RATE_WINDOW: "60"

      JWT_SECRET: ${JWT_SECRET}

      # SMTP: rellenar en el panel de Dokploy (sin SMTP_USER el envío falla
      # con 530 Authentication Required, p.ej. en Gmail).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Lexemas}

      FRONTEND_URL: https://lexemas.com
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://lexemas.com,https://www.lexemas.com}
    networks:
      - backend
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.uned.activities == true
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=dokploy-network"

        # API (HTTP -> redirect)
        - "traefik.http.routers.uned-api-http.rule=Host(`api.lexemas.com`)"
        - "traefik.http.routers.uned-api-http.entrypoints=web"
        - "traefik.http.routers.uned-api-http.middlewares=https-redirect"

        # API (HTTPS)
        - "traefik.http.routers.uned-api.rule=Host(`api.lexemas.com`)"
        - "traefik.http.routers.uned-api.entrypoints=websecure"
        - "traefik.http.routers.uned-api.tls=true"
        - "traefik.http.routers.uned-api.tls.certresolver=letsencrypt"
        - "traefik.http.routers.uned-api.middlewares=api-headers,rate-limit"
        - "traefik.http.routers.uned-api.service=uned-app"

        # WEB (HTTP -> redirect)
        - "traefik.http.routers.uned-web-http.rule=Host(`lexemas.com`) || Host(`www.lexemas.com`)"
        - "traefik.http.routers.uned-web-http.entrypoints=web"
        - "traefik.http.routers.uned-web-http.middlewares=https-redirect"

        # WEB (HTTPS)
        - "traefik.http.routers.uned-web.rule=Host(`lexemas.com`) || Host(`www.lexemas.com`)"
        - "traefik.http.routers.uned-web.entrypoints=websecure"
        - "traefik.http.routers.uned-web.tls=true"
        - "traefik.http.routers.uned-web.tls.certresolver=letsencrypt"
        - "traefik.http.routers.uned-web.middlewares=www-redirect,security-headers,compression"
        - "traefik.http.routers.uned-web.service=uned-app"

        # Service -> HTTP 8080
        - "traefik.http.services.uned-app.loadbalancer.server.port=8080"

        # Middlewares
        - "traefik.http.middlewares.api-headers.headers.customresponseheaders.X-API-Version=1.1.12"
        - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
        - "traefik.http.middlewares.rate-limit.ratelimit.burst=50"
        - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.+)"
        - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}"
        - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
        - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
        - "traefik.http.middlewares.security-headers.headers.framedeny=true"
        - "traefik.http.middlewares.security-headers.headers.sslredirect=true"
        - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
        - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
        - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
        - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
        - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
        - "traefik.http.middlewares.compression.compress=true"

  harvester:
    image: registry.storage.simplicer.com/lexemas/uned-activities:1.1.12
    # Ensure schema exists before the loop starts (same reason as backend).
    command:
      - sh
      - -lc
      - |
        php infra/scripts/migrate.php up
        exec /bin/sh /app/infra/scripts/harvest-loop.sh
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: tasks.db
      DB_PORT: "5432"
      DB_NAME: uned_activities
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: tasks.redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}

      # El harvest necesita salida a Internet (extension.uned.es). La red
      # `backend` es internal: true (sin DNS externo); dokploy-network es la
      # misma salida que ya usa el backend. Sin labels de Traefik, el servicio
      # no queda expuesto.
      DIGEST_ENABLED: ${DIGEST_ENABLED:-true}
    networks:
      - backend
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.uned.activities == true
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  backend:
    driver: overlay
    internal: true
  traefik-public:
    external: true
    name: dokploy-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
