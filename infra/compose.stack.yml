# Docker Compose Stack para producción con Traefik
# Deploy: docker stack deploy -c compose.stack.yml uned-activities
# Remove: docker stack rm uned-activities

services:
  # PostgreSQL 17 - Persistent database
  db:
    image: supabase/postgres:17.6.1.079
    environment:
      # Dokploy/Swarm: easiest is env-based password (no external secrets required).
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: uned_activities
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis 7 - Cache layer
  redis:
    image: redis:7-alpine
    command: ["sh", "-lc", "redis-server --requirepass \"$${REDIS_PASSWORD:-changeme}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Backend PHP API
  backend:
    image: registry.storage.simplicer.com/lexemas/uned-activities:${VERSION:-latest}
    # Traefik speaks HTTP, so we must run an HTTP server (not FastCGI).
    command: ["php", "-S", "0.0.0.0:8080", "-t", "apps/HttpApi/public", "apps/HttpApi/public/index.php"]
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_VERSION=${VERSION:-1.0.0}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=uned_activities
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - RATE_LIMIT=100
      - RATE_WINDOW=60
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://lexemas.com,https://www.lexemas.com}
    networks:
      - backend
      - traefik-public
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      labels:
        # Traefik configuration for API + Frontend (served from backend)
        - "traefik.enable=true"
        - "traefik.docker.network=dokploy-network"
        
        # HTTP router for API
        - "traefik.http.routers.uned-api-http.rule=Host(`api.lexemas.com`)"
        - "traefik.http.routers.uned-api-http.entrypoints=web"
        - "traefik.http.routers.uned-api-http.middlewares=https-redirect"
        
        # HTTPS router for API
        - "traefik.http.routers.uned-api.rule=Host(`api.lexemas.com`)"
        - "traefik.http.routers.uned-api.entrypoints=websecure"
        - "traefik.http.routers.uned-api.tls=true"
        - "traefik.http.routers.uned-api.tls.certresolver=letsencrypt"
        - "traefik.http.routers.uned-api.middlewares=api-headers,rate-limit"
        - "traefik.http.routers.uned-api.service=uned-api"

        # HTTP router for frontend
        - "traefik.http.routers.uned-web-http.rule=Host(`lexemas.com`) || Host(`www.lexemas.com`)"
        - "traefik.http.routers.uned-web-http.entrypoints=web"
        - "traefik.http.routers.uned-web-http.middlewares=https-redirect"

        # HTTPS router for frontend
        - "traefik.http.routers.uned-web.rule=Host(`lexemas.com`) || Host(`www.lexemas.com`)"
        - "traefik.http.routers.uned-web.entrypoints=websecure"
        - "traefik.http.routers.uned-web.tls=true"
        - "traefik.http.routers.uned-web.tls.certresolver=letsencrypt"
        - "traefik.http.routers.uned-web.middlewares=www-redirect,security-headers,compression"
        - "traefik.http.routers.uned-web.service=uned-api"
        
        # Service configuration
        - "traefik.http.services.uned-api.loadbalancer.server.port=8080"
        
        # Middlewares
        - "traefik.http.middlewares.api-headers.headers.customresponseheaders.X-API-Version=${VERSION:-1.0.0}"
        - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
        - "traefik.http.middlewares.rate-limit.ratelimit.burst=50"
        - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.+)"
        - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}"
        - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
        - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
        - "traefik.http.middlewares.security-headers.headers.framedeny=true"
        - "traefik.http.middlewares.security-headers.headers.sslredirect=true"
        - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
        - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
        - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
        - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
        - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
        - "traefik.http.middlewares.compression.compress=true"

  # Harvester - Background job for scraping activities
  harvester:
    image: registry.storage.simplicer.com/lexemas/uned-activities:${VERSION:-latest}
    command: ["/bin/sh", "/app/infra/scripts/harvest-loop.sh"]
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=uned_activities
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

networks:
  backend:
    driver: overlay
    internal: true
  traefik-public:
    external: true
    name: dokploy-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
