# Docker Compose - Production (Dokploy + Traefik)
# Traefik manages SSL and routing; no public ports exposed here.

services:
  # PostgreSQL 17
  db:
    image: supabase/postgres:17.6.1.079
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-uned_activities}
      POSTGRES_USER: postgres
    volumes:
      - uned_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network

  # Redis 7
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - uned_data:/data/redis
    networks:
      - app_network

  # Backend PHP API - internal
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=uned_activities
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT=100
      - RATE_WINDOW=60
    volumes:
      - uned_data:/data/logs
    expose:
      - "9000"
    networks:
      - app_network
      - dokploy-network

  # Nginx reverse proxy for PHP
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    depends_on:
      - backend
    networks:
      - app_network
      - dokploy-network

  # Harvest scheduler - refresh activities periodically
  harvester:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=uned_activities
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT=100
      - RATE_WINDOW=60
    volumes:
      - uned_data:/data/logs
    command: ["/bin/sh", "/app/infra/scripts/harvest-loop.sh"]
    depends_on:
      - db
      - redis
    networks:
      - app_network

  # Frontend static (Traefik routes to frontend)
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.lexemas.com}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dokploy-network

volumes:
  uned_data:
    name: uned_data
    driver: local

networks:
  app_network:
    driver: bridge
    internal: true
  dokploy-network:
    external: true
