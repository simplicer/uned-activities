# Docker Compose - Producción (Dokploy + Traefik)
# Traefik gestiona SSL y enrutado; no se exponen puertos públicos aquí.

services:
  # PostgreSQL 17
  db:
    image: supabase/postgres:17.6.1.079
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-uned_activities}
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network

  # Redis 7
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - app_network

  # Backend PHP API - interno
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./env/local.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=uned_activities
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT=100
      - RATE_WINDOW=60
    expose:
      - "8080"
    networks:
      - app_network
      - dokploy-network

  # Harvest scheduler - refresh activities periodically
  harvester:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./env/local.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=uned_activities
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT=100
      - RATE_WINDOW=60
    command: ["/bin/sh", "/app/infra/scripts/harvest-loop.sh"]
    depends_on:
      - db
      - redis
    networks:
      - app_network

  # Frontend estático (Traefik enruta lexemas.com)
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.lexemas.com}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dokploy-network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge
    internal: true
  dokploy-network:
    external: true
