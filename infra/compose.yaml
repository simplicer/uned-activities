# Docker Compose - Production (Dokploy + Traefik)
# Traefik manages SSL and routing using labels

services:
  # PostgreSQL 17
  db:
    image: supabase/postgres:17.6.1.079
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-uned_activities}
      POSTGRES_USER: postgres
    volumes:
      - uned_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network

  # Redis 7
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - uned_data:/data/redis
    networks:
      - app_network

  # Backend PHP API
  backend:
    build:
      context: ..
      dockerfile: containers/Containerfile.backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=uned_activities
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT=100
      - RATE_WINDOW=60
    volumes:
      - uned_data:/data/logs
    expose:
      - "9000"
    networks:
      - app_network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.backend.rule=Host(`api.lexemas.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=9000"
      - "traefik.http.routers.backend.service=backend"

  # Harvest scheduler
  harvester:
    build:
      context: ..
      dockerfile: containers/Containerfile.backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=uned_activities
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT=100
      - RATE_WINDOW=60
    volumes:
      - uned_data:/data/logs
    command: ["/bin/sh", "/app/infra/scripts/harvest-loop.sh"]
    depends_on:
      - db
      - redis
    networks:
      - app_network

  # Frontend static
  frontend:
    build:
      context: ..
      dockerfile: containers/Containerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.lexemas.com}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.frontend.rule=Host(`lexemas.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  uned_data:
    name: uned_data
    driver: local

networks:
  app_network:
    driver: bridge
    internal: true
  dokploy-network:
    external: true
